<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pasapalabra 3D · Plató (fan-made)</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#02030a;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#fff}
  #app{position:fixed;inset:0}
  .panel{position:fixed;z-index:5;display:flex;gap:8px;flex-wrap:wrap}
  #epocas{top:12px;left:12px}
  #epocas button{display:flex;flex-direction:column;align-items:flex-start;min-width:120px}
  #epocas button span{font-size:12px;opacity:.85}
  #epocas button em{font-size:11px;color:#ffd35a;font-style:normal}
  #camaras{bottom:14px;left:50%;transform:translateX(-50%);justify-content:center}
  #extras{top:12px;right:12px;flex-direction:column;align-items:flex-end}
  button{background:rgba(10,25,90,.82);color:#fff;border:2px solid #3f7dff;border-radius:12px;padding:8px 14px;font-size:14px;cursor:pointer;backdrop-filter:blur(4px)}
  button:hover:not(:disabled){background:#1746d6}
  button.activa{background:#ff7a00;border-color:#ffc21a}
  button:disabled{opacity:.55;cursor:not-allowed;border-style:dashed}
  #titulo{position:fixed;bottom:66px;left:50%;transform:translateX(-50%);font-size:12px;opacity:.6;z-index:5;text-align:center}
  body.sin-ui .panel:not(#extras), body.sin-ui #titulo{display:none}
  body.sin-ui #extras button:not(#btnUI){display:none}
  #fx-streak,#fx-flash,#fx-fade{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0}
  #fx-streak{background:linear-gradient(180deg,transparent 40%,rgba(255,255,255,.95) 49%,#fff 50%,rgba(255,255,255,.95) 51%,transparent 60%)}
  #fx-flash{background:#fff}
  #fx-fade{background:#fff}
  #fx-fade.saliendo{transition:opacity .9s ease}
  #btnSaltar{position:fixed;right:14px;bottom:14px;z-index:9;display:none}
  body.en-cabecera .panel,body.en-cabecera #titulo,body.en-cabecera #medios{display:none}
  body.en-cabecera #btnSaltar{display:block}
  #aviso{position:fixed;top:90px;left:50%;transform:translateX(-50%);background:rgba(255,122,0,.95);padding:10px 16px;border-radius:10px;z-index:9;opacity:0;transition:opacity .3s;pointer-events:none;max-width:80vw;text-align:center}
  #aviso.visible{opacity:1}
  #medios{position:fixed;right:12px;top:230px;width:330px;max-height:60vh;overflow:auto;background:rgba(5,15,60,.92);border:2px solid #3f7dff;border-radius:12px;padding:10px;z-index:6;display:none;font-size:13px}
  #medios.abierto{display:block}
  .fila-medio{border-bottom:1px solid #2a4aa0;padding:8px 0}
  .fila-medio span{opacity:.85}
  .bts{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
  .bts button,.bt{font-size:12px;padding:5px 9px;border-radius:9px}
  .bt{background:#1746d6;border:2px solid #3f7dff;cursor:pointer;display:inline-block}
  .bt input{display:none}
  body.sin-ui #medios{display:none}
  body.captura button,body.captura .panel,body.captura #titulo,body.captura #medios{display:none!important}
  select{background:rgba(10,25,90,.82);color:#fff;border:2px solid #3f7dff;border-radius:12px;padding:8px 10px;font-size:14px}
  #juego{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(860px,94vw);max-height:86vh;overflow:auto;background:rgba(4,12,48,.94);border:2px solid #3f7dff;border-radius:16px;padding:14px 18px;z-index:7;display:none;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  #juego.abierto{display:block}
  body.jugando .panel,body.jugando #titulo,body.jugando #medios{display:none}
  .j-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid #2a4aa0;padding-bottom:8px;margin-bottom:10px}
  .j-tit{font-weight:800;font-size:18px;color:#ffd35a}.j-eqs{display:flex;gap:10px}.eq{border-left:6px solid var(--c);padding-left:6px}
  .j-reloj{font:800 24px monospace;color:#ffb020;min-width:70px;text-align:right}
  .j-def{font-size:20px;margin:10px 0;line-height:1.35}.j-def.grande{font-size:28px;font-weight:800;text-align:center}
  .j-sub{opacity:.8;font-size:13px}.j-reglas{font-size:15px;line-height:1.45;opacity:.95}
  .j-opc{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.j-opc.vert{flex-direction:column;align-items:stretch}
  .j-opc button{font-size:16px}.buzz{background:#c01020!important;border-color:#ff6060!important;font-size:22px!important;padding:14px 26px!important}
  .j-resp{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.j-resp input{flex:1;min-width:200px;font-size:18px;padding:9px 12px;border-radius:10px;border:2px solid #3f7dff;background:#06102e;color:#fff}
  .pasa{background:#1a3a9a!important}.j-cont{display:block;margin:12px auto 0;background:#ff7a00;border-color:#ffc21a;font-size:17px}
  .j-aviso{font-size:19px;font-weight:700;margin:8px 0;text-align:center}
  .j-hang{font:800 34px monospace;letter-spacing:4px;text-align:center;margin:10px}.j-hang.peq{font-size:22px}
  .j-teclado{display:flex;flex-wrap:wrap;gap:4px}.j-teclado button{padding:6px 9px;font-size:14px}
  .j-sopa{font:800 26px monospace;letter-spacing:12px;text-align:center;line-height:1.5;background:#0a1a5a;border-radius:10px;padding:8px}
  .j-grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.j-grid9>*{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a1a5a;border-radius:10px;font-weight:700}
  .j-grid9 .ok{background:#147a3a}.j-grid9 small{opacity:.7}
  .j-grid16{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font:800 22px Arial}.j-grid16 span{background:#3a1080;border-radius:8px;padding:10px}.j-grid16 .off{opacity:.3}
  .j-tira{display:flex;gap:6px;justify-content:center}.j-tira span{width:34px;height:34px;border-radius:50%;background:#2a5cff;display:grid;place-items:center;font-weight:800}.j-tira .cur{background:#ffd400;color:#000}
  .j-final{display:grid;grid-template-columns:220px 1fr 220px;gap:10px;align-items:center}.j-final h4{margin:0;text-align:center}.j-rosco{width:100%}
  .j-letra{font-size:22px;color:#ffd35a}
  @media(max-width:700px){.j-final{grid-template-columns:1fr}}
  #historia{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(820px,94vw);z-index:7;display:none}
  #historia.abierto{display:block}
  .h-bocadillo{display:flex;gap:14px;align-items:flex-start;background:rgba(255,255,255,.96);color:#0a1a4a;border-radius:18px;padding:14px 18px;box-shadow:0 8px 30px rgba(0,0,0,.5);position:relative}
  .h-bocadillo:after{content:'';position:absolute;left:46px;top:-14px;border:14px solid transparent;border-bottom-color:rgba(255,255,255,.96);border-top:0}
  .h-avatar{width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font:800 28px Arial;border:3px solid #fff;box-shadow:0 0 0 3px #0a1a4a}
  .h-texto p{font-size:17px;line-height:1.45;margin:6px 0}.h-texto small{opacity:.7}
  .h-bts{display:flex;gap:8px}.h-bts button{font-size:13px;padding:6px 12px}
  #cargando{position:fixed;inset:0;display:grid;place-items:center;font-size:22px;z-index:10;background:#02030a}
</style>
</head>
<body>
<div id="cargando">Montando el plató…</div>
<div id="app"></div>
<div id="epocas" class="panel"></div>
<div id="extras" class="panel">
  <button id="btnModo">🎙️ Ver mesa de pruebas</button>
  <button id="btnRosco">▶️ Simular rosco</button>
  <button id="btnBloom">✨ Brillo: sí</button>
  <button id="btnJugar">🎮 Jugar programa</button>
  <button id="btnHistoria">📖 Modo historia</button>
  <select id="selEspecial" title="Programas especiales"></select>
  <button id="btnPaseo">🚶 Paseo (WASD)</button>
  <button id="btnCabecera">🎬 Ver cabecera</button>
  <button id="btnMedios">🎵 Música y logo</button>
  <button id="btnUI">👁️ Ocultar interfaz</button>
</div>
<div id="medios"><b>Música y logo de cabecera por época</b><br><small>Lo que subas se guarda en este navegador. También puedes poner archivos en las carpetas audio/ y logos/ (ver LEEME.txt).</small><div id="medios-lista"></div></div>
<div id="fx-streak"></div><div id="fx-flash"></div><div id="fx-fade"></div>
<button id="btnSaltar">⏭️ Saltar cabecera</button>
<div id="aviso"></div>
<div id="camaras" class="panel"></div>
<div id="juego"></div>
<div id="historia"></div>
<div id="titulo">Recreación no oficial con fines de juego · Arrastra para girar, rueda para zoom, clic derecho para desplazar</div>
<script src="data/preguntas_extra.js"></script>
<script src="js/app.js"></script>
</body>
</html>
